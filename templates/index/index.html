<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たびあい</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
</head>

<body class="bg-white text-gray-800">

  <header class="absolute top-0 w-full z-10" x-data="{ open: false }">
      <div class="container mx-auto flex justify-between items-center px-6 py-6 text-white">
          
          <h1 class="flex items-baseline font-light tracking-tight">
              <a href="{{ url_for('index.index') }}" class="text-5xl font-normal">たびあい</a>
              <span class="text-xl font-medium ml-4">-性格診断×LLMで自分らしい旅行プラン-</span>
          </h1>

          <nav class="hidden md:flex">
              <ul class="flex space-x-10 text-xl font-medium">
                  <li><a href="{{ url_for('index.index') }}" class="hover:text-gray-300">TOP</a></li>
                  <li><a href="{{ url_for('index.registration') }}" class="hover:text-gray-300">REGISTRATION</a></li>
                  <li><a href="{{ url_for('index.login') }}" class="hover:text-gray-300">LOG IN</a></li>
              </ul>
          </nav>

          <div class="md:hidden">
              <button @click="open = !open" class="border border-white px-2 py-1 rounded text-white focus:outline-none">
                  <svg x-show="!open" class="w-6 h-6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
                      <path d="M4 6h16M4 12h16m-7 6h7"></path>
                  </svg>
                  <svg x-show="open" class="w-6 h-6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
                      <path d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
              </button>
          </div>
      </div>

      <nav x-show="open" 
           @click.away="open = false" 
           class="md:hidden absolute top-full left-0 w-full bg-gray-800/90 text-white" 
           style="display: none;">
          <ul class="flex flex-col items-center py-4 text-xl font-medium">
              <li class="w-full text-center"><a href="{{ url_for('index.index') }}" class="block py-3 hover:bg-gray-700">TOP</a></li>
              <li class="w-full text-center"><a href="{{ url_for('index.registration') }}" class="block py-3 hover:bg-gray-700">REGISTRATION</a></li>
              <li class="w-full text-center"><a href="{{ url_for('index.login') }}" class="block py-3 hover:bg-gray-700">LOG IN</a></li>
          </ul>
      </nav>
  </header>
    <section class="relative h-screen overflow-hidden">
    
        <div class="swiper mainVisualSwiper h-full absolute inset-0 z-0">
            
            <div class="swiper-wrapper">
                <!-- 出典　https://find47.jp/ -->
                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image3.jpg') }}" 
                        alt="メインビジュアル 1" 
                        class="w-full h-full object-cover">
                </div>
                
                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image8.jpg') }}" 
                        alt="メインビジュアル 2" 
                        class="w-full h-full object-cover">
                </div>
                
                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image10.jpg') }}" 
                        alt="メインビジュアル 3" 
                        class="w-full h-full object-cover">
                </div>

                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image11.jpg') }}" 
                        alt="メインビジュアル 4" 
                        class="w-full h-full object-cover">
                
                </div>

                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image12.jpg') }}" 
                        alt="メインビジュアル 5" 
                        class="w-full h-full object-cover">

                </div>

                

            </div>
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 text-white animate-bounce z-10">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
        </div>
    </section>

    <main>
        <section class="py-16 sm:py-24 bg-gray-50">
            <div class="container mx-auto px-6 max-w-3xl text-center">
                <h1 class="text-4xl font-bold mb-8 tracking-tight">
                    旅に出よう。
                </h1>
                <div class="space-y-6 leading-relaxed text-gray-700">
                  <p>
                      僕たちが目指すのは、<br class="sm:hidden">
                      もっと気軽に、自分らしく旅を楽しめる世界。
                  </p>
                  <p>
                      性格診断×LLMが導き出す、<br>
                      あなたにぴったりの旅のかたち。<br>
                      それは、あなたの中にある“旅心”を映す鏡。
                  </p>
                  <p class="text-xl font-semibold pt-4">
                      MY TRAVEL STYLE
                  </p>
                  <p>
                      自分を知り、世界を感じる。<br>
                      そんな、新しい旅のはじまりを。
                  </p>

                </div>
            </div>
        </section>
    </main>

    <script>
        // メインビジュアルのスライダーを初期化
        var swiper = new Swiper(".mainVisualSwiper", {
            effect: "fade",         // フェードエフェクト
            fadeEffect: {
                crossFade: true     // クロスフェードを有効に
            },
            autoplay: {
                delay: 4000,            // 4秒ごとに切り替え
                disableOnInteraction: false, // ユーザー操作後も自動再生を続ける
            },
            loop: true,             // ループ再生
            speed: 1500,            // 切り替えのアニメーション速度 (1.5秒)
            allowTouchMove: false,  // マウスでのドラッグ操作を無効化
        });
    </script>

</body>
</html>
