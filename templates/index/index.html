<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たびあい</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
</head>

<body class="bg-white text-gray-800" x-data="{ mobileMenuOpen: false, modalOpen: '' }">

  <header class="absolute top-0 w-full z-10">
      <div class="container mx-auto flex justify-between items-center px-6 py-6 text-white">
          
          <h1 class="flex items-baseline font-light tracking-tight">
              <a href="{{ url_for('index.index') }}" class="text-5xl font-normal">たびあい</a>
              <span class="text-xl font-medium ml-4">-性格診断×LLMで自分らしい旅行プラン-</span>
          </h1>

          <nav class="hidden md:flex">
              <ul class="flex space-x-10 text-xl font-medium">
                  <li><a href="{{ url_for('index.index') }}" class="hover:text-gray-300">TOP</a></li>
                  <li><a href="#" @click.prevent="modalOpen = 'register'" class="hover:text-gray-300">REGISTRATION</a></li>
                  <li><a href="#" @click.prevent="modalOpen = 'login'" class="hover:text-gray-300">LOG IN</a></li>
              </ul>
          </nav>

          <div class="md:hidden">
              <button @click="mobileMenuOpen = !mobileMenuOpen" class="border border-white px-2 py-1 rounded text-white focus:outline-none">
                  <svg x-show="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
                      <path d="M4 6h16M4 12h16m-7 6h7"></path>
                  </svg>
                  <svg x-show="mobileMenuOpen" class="w-6 h-6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
                      <path d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
              </button>
          </div>
      </div>

      <nav x-show="mobileMenuOpen" 
           @click.away="mobileMenuOpen = false" 
           class="md:hidden absolute top-full left-0 w-full bg-gray-800/90 text-white" 
           style="display: none;">
          <ul class="flex flex-col items-center py-4 text-xl font-medium">
              <li class="w-full text-center"><a href="{{ url_for('index.index') }}" class="block py-3 hover:bg-gray-700">TOP</a></li>
              <li class="w-full text-center"><a href="#" @click.prevent="modalOpen = 'register'; mobileMenuOpen = false" class="block py-3 hover:bg-gray-700">REGISTRATION</a></li>
              <li class="w-full text-center"><a href="#" @click.prevent="modalOpen = 'login'; mobileMenuOpen = false" class="block py-3 hover:bg-gray-700">LOG IN</a></li>
          </ul>
      </nav>
  </header>
    <section class="relative h-screen overflow-hidden">
    
        <div class="swiper mainVisualSwiper h-full absolute inset-0 z-0">
            
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image3.jpg') }}" 
                        alt="メインビジュアル 1" 
                        class="w-full h-full object-cover">
                </div>
                
                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image8.jpg') }}" 
                        alt="メインビジュアル 2" 
                        class="w-full h-full object-cover">
                </div>
                
                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image10.jpg') }}" 
                        alt="メインビジュアル 3" 
                        class="w-full h-full object-cover">
                </div>

                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image11.jpg') }}" 
                        alt="メインビジュアル 4" 
                        class="w-full h-full object-cover">
                
                </div>

                <div class="swiper-slide">
                    <img src="{{ url_for('static', filename='img/image12.jpg') }}" 
                        alt="メインビジュアル 5" 
                        class="w-full h-full object-cover">

                </div>

                

            </div>
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 text-white animate-bounce z-10">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
        </div>
    </section>

    <main>
        <section class="py-16 sm:py-24 bg-gray-50">
            <div class="container mx-auto px-6 max-w-3xl text-center">
                <h1 class="text-4xl font-bold mb-8 tracking-tight">
                    旅に出よう。
                </h1>
                <div class="space-y-6 leading-relaxed text-gray-700">
                  <p>
                      僕たちが目指すのは、<br class="sm:hidden">
                      もっと気軽に、自分らしく旅を楽しめる世界。
                  </p>
                  <p>
                      性格診断×LLMが導き出す、<br>
                      あなたにぴったりの旅のかたち。<br>
                      それは、あなたの中にある“旅心”を映す鏡。
                  </p>
                  <p class="text-xl font-semibold pt-4">
                      MY TRAVEL STYLE
                  </p>
                  <p>
                      自分を知り、世界を感じる。<br>
                      そんな、新しい旅のはじまりを。
                  </p>

                </div>
            </div>
        </section>
    </main>

    <div x-show="modalOpen" 
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
         style="display: none;">

        <div @click.away="modalOpen = ''" 
             x-show="modalOpen"
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-90"
             x-transition:enter-end="opacity-100 scale-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-90"
             class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md relative text-gray-800">

            <button @click="modalOpen = ''" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <div x-show="modalOpen === 'register'">
                <h2 class="text-2xl font-bold mb-6 text-center">新規登録</h2>
                
                <form action="{{ url_for('index.registration') }}" method="post">
                  <div class="mb-5">
                    <label for="username" class="block mb-2 text-sm font-medium text-[#31405F]">ユーザー名</label>
                    <input type="text" name="username" class="bg-[#F6F5F3] border border-[#C7D8D3] text-[#2C3E50] text-sm rounded-lg focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5" placeholder="ユーザー名" required maxlength="32">
                  </div>
                  <div class="mb-5">
                    <label for="email" class="block mb-2 text-sm font-medium text-[#31405F]">メールアドレス</label>
                    <input type="email" name="email" class="bg-[#F6F5F3] border border-[#C7D8D3] text-[#2C3E50] text-sm rounded-lg focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5" placeholder="john.doe@company.com" required maxlength="64">
                  </div>
                  <div class="mb-5">
                    <label for="password" class="block mb-2 text-sm font-medium text-[#31405F]">パスワード</label>
                    <input type="password" name="password" class="bg-[#F6F5F3] border border-[#C7D8D3] text-[#2C3E50] text-sm rounded-lg focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5" placeholder="パスワード" required maxlength="32">
                  </div>
                  <div class="mb-5">
                    <label for="confirm_password" class="block mb-2 text-sm font-medium text-[#31405F]">パスワード（確認）</label>
                    <input type="password" name="confirm_password" class="bg-[#F6F5F3] border border-[#C7D8D3] text-[#2C3E50] text-sm rounded-lg focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5" placeholder="パスワード（確認）" required maxlength="32">
                  </div>
                  <button type="submit" id="submit-btn"
                    class="w-full text-white font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-200"
                    style="background-color: #4F8C8C;"
                    onmouseover="this.style.backgroundColor='#3E7676'"
                    onmouseout="this.style.backgroundColor='#4F8C8C'">
                    登録
                  </button>
                  <div class="mt-6 text-sm text-[#31405F] flex justify-between items-center">
                    <a href="#" @click.prevent="modalOpen = ''" class="text-[#4F8C8C] font-medium hover:underline">
                      &larr; 戻る
                    </a>
                    
                    <span>
                      登録済みの方は
                      <a href="#" @click.prevent="modalOpen = 'login'" class="text-[#4F8C8C] font-medium hover:underline">
                        こちら
                      </a>
                    </span>
                  </div>
                </form>

            </div>

            <div x-show="modalOpen === 'login'">
                <h2 class="text-2xl font-bold mb-6 text-center">ログイン</h2>
                
                <form action="{{ url_for('index.login') }}" method="post">
                  <div class="mb-5">
                    <label for="username" class="block mb-2 text-sm font-medium text-[#31405F]">ユーザー名</label>
                    <input type="text" name="username" class="bg-[#F6F5F3] border border-[#C7D8D3] text-[#2C3E50] text-sm rounded-lg focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5" placeholder="ユーザー名" required maxlength="32">
                  </div>
                  <div class="mb-5">
                    <label for="password" class="block mb-2 text-sm font-medium text-[#31405F]">パスワード</label>
                    <input type="password" name="password" class="bg-[#F6F5F3] border border-[#C7D8D3] text-[#2C3E50] text-sm rounded-lg focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5" placeholder="パスワード" required maxlength="32">
                  </div>
                  <button type="submit" id="submit-btn" class="w-full text-white font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-200" style="background-color: #4F8C8C;" onmouseover="this.style.backgroundColor='#3E7676'" onmouseout="this.style.backgroundColor='#4F8C8C'">
                    ログイン </button>
                  <div class="mt-6 text-sm text-[#31405F] flex justify-between items-center">
                    
                    <a href="#" @click.prevent="modalOpen = ''" class="text-[#4F8C8C] font-medium hover:underline">
                      &larr; 戻る
                    </a>
                    
                    <span>
                      アカウントをお持ちでない方は
                      <a href="#" @click.prevent="modalOpen = 'register'" class="text-[#4F8C8C] font-medium hover:underline">
                        こちら
                      </a>
                    </span>
                  </div>
                </form>
            </div>

        </div>
    </div>
    <script>
        // メインビジュアルのスライダーを初期化
        var swiper = new Swiper(".mainVisualSwiper", {
            effect: "fade",         // フェードエフェクト
            fadeEffect: {
                crossFade: true     // クロスフェードを有効に
            },
            autoplay: {
                delay: 4000,            // 4秒ごとに切り替え
                disableOnInteraction: false, // ユーザー操作後も自動再生を続ける
            },
            loop: true,             // ループ再生
            speed: 1500,            // 切り替えのアニメーション速度 (1.5秒)
            allowTouchMove: false,  // マウスでのドラッグ操作を無効化
        });
    </script>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
