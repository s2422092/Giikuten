<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>旅行条件入力 | たびあい</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.js"></script>
  <script>
    tailwind.config = {
      plugins: [daisyui],
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=NotoSansJP:wght@400;600&family=NotoSerifJP:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Noto Sans JP", sans-serif;
      color: #f8fafc;
      background: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80")
        no-repeat center center fixed;
      background-size: cover;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      z-index: -1;
    }

    h1, h2, legend {
      font-family: "Noto Serif JP", serif;
    }

    .page-card {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(12px);
      color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
    }

    .page-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(255, 255, 255, 0.15);
    }

    input, select, textarea {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      width: 100%;
    }

    input::placeholder,
textarea::placeholder {
  color: #b2f5ea; /* 明るいミント系。暗背景で高コントラスト */
  opacity: 1;     /* 薄すぎ防止 */
  font-weight: 500;
}

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #4F8C8C;
      box-shadow: 0 0 0 2px rgba(79, 140, 140, 0.4);
    }

    header, .dock {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      color: #fff;
    }

    legend {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .form-title {
      color: #fff;
    }

    .text-gray-500 {
  color: #e0f7f6 !important; /* 明るいティール寄りホワイト */
  opacity: 0.95;
}

.text-sm.text-gray-500,
.text-xs.text-gray-500 {
  color: #e0f7f6 !important; /* 小さい文字もくっきり見えるように */
}
  </style>
</head>

<body class="pb-28 pt-20">

<!-- ヘッダー -->
<header class="fixed top-0 left-0 w-full flex justify-between items-center p-4 shadow-md z-50 text-white border-b border-white/10"
        style="background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);">
  <h1 class="text-2xl font-bold tracking-wide">旅行登録画面</h1>
  <div class="flex items-center space-x-4">
    <a href="{{ url_for('home.information') }}"
      class="inline-flex items-center justify-center w-10 h-10 rounded-full
      bg-transparent hover:bg-white/30 text-white transition shadow-none"
      aria-label="Information" title="Information">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"
          class="w-6 h-6">
          <circle cx="12" cy="12" r="9"/>
          <line x1="12" y1="10" x2="12" y2="16"/>
          <circle cx="12" cy="7" r="0.1"/>
        </svg>
    </a>
    <a href="{{ url_for('setting.setting') }}">
      <img src="{{ user_icon }}"
           alt="User Icon"
           class="w-8 h-8 rounded-full object-cover border-2 border-white cursor-pointer hover:scale-110 transition-transform duration-200" />
    </a>
  </div>
</header>

<!-- メイン -->
<main class="mt-4px-6">
  <h1 class="text-2xl font-semibold text-center mb-8 form-title">
    旅行条件（{{ username }} / MBTI: {{ mbti }}）
  </h1>

  <form method="post" action="{{ url_for('plan.plan') }}" id="plan-form" class="space-y-6 max-w-4xl mx-auto">

    <!-- 基本情報 -->
    <fieldset class="page-card rounded-xl p-6">
      <legend class="font-bold text-lg border-b pb-1 ">基本情報</legend>

      <div class="mt-0">
        <label class="block mb-1 font-medium">旅行名：</label>
        <input name="trip_name" required maxlength="64" placeholder="例：京都旅行"
          class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
      </div>

      <div class="mt-4 flex flex-col gap-3">
        <label class="font-medium">開始日：</label>
        <input type="date" name="start_date" required class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
      </div>

      <div class="mt-4">
        <label class="font-medium">終了日：</label>
        <input type="date" name="end_date" required class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
      </div>

      <div class="mt-4">
        <label class="font-medium">人数：</label>
        <input type="number" name="headcount" min="1" value="1" required class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
      </div>

      <div class="mt-4">
        <label class="font-medium">予算（円）：</label>
        <input type="number" name="budget" min="1000" step="1000" required class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
      </div>

      <div class="mt-4">
        <label class="font-medium">補足（任意）：</label>
        <input name="notes" placeholder="車NG / 辛い物NG など" class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none">
      </div>
    </fieldset>

    <!-- 行き先 -->
    <fieldset class="page-card rounded-xl p-6">
      <legend class="font-bold text-lg border-b pb-1 ">行き先</legend>

      <div class="mt-0">
        <label class="block mb-1 font-medium">地域（必須）：</label>
        <select id="region-select" name="region" required class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none">
          <option value="">読込中...</option>
        </select>
      </div>

      <div class="mt-3">
        <label class="block mb-1 font-medium">都道府県（任意）：</label>
        <select id="prefecture-select" name="prefecture" class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none">
          <option value="">自動提案に任せる</option>
        </select>
        <span class="text-sm text-gray-500">未選択のままでOK（LLMが提案）</span>
      </div>

      <div class="mt-3">
        <label class="block mb-1 font-medium">市区町村（任意）：</label>
        <select id="city-select" name="city" class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none">
          <option value="">自動提案に任せる</option>
        </select>
        <span class="text-sm text-gray-500">未選択のままでOK（LLMが提案）</span>
      </div>

      <div id="nearby-checkbox-wrapper" class="mt-4 hidden">
        <label class="inline-flex items-center space-x-2">
          <input type="checkbox" name="suggest_nearby" id="suggest_nearby"
                 class="w-4 h-4 rounded border-gray-300 focus:ring-emerald-500">
          <span class="text-sm text-white">選択地域の近隣観光地も提案してほしい</span>
        </label>
        <p class="text-xs text-gray-500 mt-1">
          ※2日以上の旅行時のみ有効。<br>
          例：嵐山を選択 → 2日目に東山など近隣エリアも含めて提案。
        </p>
      </div>
    </fieldset>

    <!-- 絶対に行きたい場所 -->
    <fieldset class="page-card rounded-xl p-6">
      <legend class="font-bold text-lg border-b pb-1 ">絶対に行きたい場所（任意）</legend>
      <div class="mt-0">
        <label class="block mb-1 font-medium">行きたいスポット：</label>
        <textarea name="must_visit" rows="2" placeholder="例：清水寺、金閣寺、伏見稲荷大社" class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none"></textarea>
        <p class="text-xs text-gray-500 mt-1">カンマ区切りで複数入力可（例：「清水寺、祇園、嵐山」など）</p>
      </div>
    </fieldset>

    <!-- 出発と交通 -->
    <fieldset class="page-card rounded-xl p-6">
      <legend class="font-bold text-lg border-b pb-1">出発と交通</legend>
      <div class="mt-0">
        <label class="block mb-1 font-medium">出発地（任意）：</label>
        <input name="departure" placeholder="例：東京駅 / 新大阪駅 / 横浜市内" class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none">
        <p class="text-xs text-gray-500 mt-1">未入力でもOK（地域から推定）。</p>
      </div>

      <div class="mt-3">
        <label class="block mb-1 font-medium">希望する交通手段（任意）：</label>
        <select name="transport_pref" class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none">
          <option value="auto" selected>おまかせ（条件に合わせて最適化）</option>
          <option value="public">公共交通中心（電車・バス）</option>
          <option value="train">鉄道中心（在来線）</option>
          <option value="shinkansen">新幹線優先</option>
          <option value="car">レンタカー中心</option>
          <option value="plane">飛行機優先</option>
          <option value="mixed">混在</option>
        </select>
      </div>
      <div class="mt-4 flex items-center gap-2">
        <input id="suggest_final_lodging" type="checkbox" name="suggest_final_lodging" class="w-4 h-4">
        <label for="suggest_final_lodging" class="text-sm">最終目的地周辺の<strong>具体的な宿</strong>も提案してほしい</label>
      </div>
    </fieldset>

    <!-- 送信ボタン -->
    <button type="submit"
      class="bg-emerald-600/70 hover:bg-emerald-700/80 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm transition-all duration-200">
      決定
    </button>
  </form>
</main>

<!-- Dockナビ -->
<div class="dock fixed bottom-0 left-0 w-full border-t border-white/20 shadow-inner flex justify-around py-2 text-white">
  <a href="{{ url_for('my_travel.travel_details') }}" class="flex flex-col items-center hover:text-teal-300">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
    </svg>
    <span class="text-xs mt-1">Time Line</span>
  </a>
  <a href="{{ url_for('home.home') }}" class="flex flex-col items-center hover:text-teal-300">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="3 12 12 3 21 12"/><path d="M5 10v10h14V10"/>
    </svg>
    <span class="text-xs mt-1">Home</span>
  </a>
  <a href="{{ url_for('plan.plan') }}" class="flex flex-col items-center hover:text-teal-300">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <span class="text-xs mt-1">Travel Plan</span>
  </a>
</div>

<script src="{{ url_for('static', filename='js/geo.js') }}"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // --- 既存の要素取得 ---
  const startInput = document.querySelector("input[name='start_date']");
  const endInput = document.querySelector("input[name='end_date']");
  const citySelect = document.getElementById("city-select");
  const nearbyBox = document.getElementById("nearby-checkbox-wrapper");
  const regionSelect = document.getElementById('region-select');
  const prefectureSelect = document.getElementById('prefecture-select');

  // --- 既存の関数 ---
  function checkShowNearby() {
    const start = new Date(startInput.value);
    const end = new Date(endInput.value);
    const days = (end - start) / (1000 * 60 * 60 * 24) + 1;
    const cityChosen = citySelect.value.trim() !== "";

    if (days >= 2 && cityChosen) {
      nearbyBox.classList.remove("hidden");
    } else {
      nearbyBox.classList.add("hidden");
    }
  }

  // --- 既存のイベントリスナー ---
  startInput.addEventListener("change", checkShowNearby);
  endInput.addEventListener("change", checkShowNearby);
  citySelect.addEventListener("change", checkShowNearby);

  
  // --- ✅ [ここからが最重要] URLパラメータから '行き先' を自動入力する処理 ---
  
  const params = new URLSearchParams(window.location.search);
  const regionParam = params.get('region');
  const prefectureParam = params.get('prefecture');

  // [追加] 都道府県の読み込みを待つ関数
  function waitForPrefectureLoad(prefValue) {
    // prefecture-select が geo.js によって書き換わるのを監視
    const prefObserver = new MutationObserver((mutations, obs) => {
      // <option> が 1つ ("自動提案に任せる") 以上になったら
      if (prefectureSelect.options.length > 1) {
        
        prefectureSelect.value = prefValue; // URLの県名をセット
        
        // 市区町村リストの読み込みや 'checkShowNearby' のために change イベントを発火
        prefectureSelect.dispatchEvent(new Event('change'));
        
        obs.disconnect(); // 監視を終了
      }
    });
    // 監視を開始
    prefObserver.observe(prefectureSelect, { childList: true });
  }

  // もし URL に 'region' が指定されていたら
  if (regionParam) {
    
    // region-select が geo.js によって書き換わるのを監視
    const regionObserver = new MutationObserver((mutations, obs) => {
      
      // <option> が 1つ ("読込中...") 以上になったら
      if (regionSelect.options.length > 1) {
        
        regionSelect.value = regionParam; // URLの地方名をセット
        
        // geo.js の「都道府県リスト読み込み」を起動するため、change イベントを強制的に発火
        regionSelect.dispatchEvent(new Event('change')); 
        
        obs.disconnect(); // 監視を終了

        // もし URL に 'prefecture' も指定されていたら
        if (prefectureParam) {
          // 次は都道府県リストの読み込み待ちを開始
          waitForPrefectureLoad(prefectureParam);
        }
      }
    });

    // region-select の子要素（<option>）の変更監視を開始
    regionObserver.observe(regionSelect, { childList: true });
  } 
  // --- ✅ [ここまで追加] ---

});
</script>
</body>
</html>
