<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>旅行条件入力</title>
  <!-- ✅ Tailwind  DaisyUI CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #F6F5F3;
      color: #2C3E50;
      font-family: "Noto Sans JP", sans-serif;
    }
    
  </style>
</head>

<!--
追加で入れる項目
ユーザーの性格と同行者の性格が同じであることを前提とする

1:誰と行くか、恋人、親戚、友達、両親

2:ユーザー側の性格はバックエンドで入れる。旅行を一緒に行く人はみんな同じ人であることを前提としておくそれ以外の特徴量は性格診断の結果のそれぞれの結果から持ってくる
-->


<body class="pb-28 pt-20">


<header class="fixed top-0 left-0 w-full flex justify-between items-center p-4 bg-white shadow-md z-50">
  <h1 class="text-2xl font-bold text-teal-700 tracking-wide">📖 京都旅行しおり</h1>
  <div class="flex items-center space-x-4">
    <a href="{{ url_for('home.information') }}" class="text-2xl hover:scale-110 transition-transform duration-200">💬</a>

    <a href="{{ url_for('setting.setting') }}">
      <img src="{{ user_icon }}"
           alt="User Icon"
           class="w-8 h-8 rounded-full object-cover border-2 border-teal-600 cursor-pointer hover:scale-110 transition-transform duration-200" />
    </a>
  </div>
</header>




<main class="mt-20">
  <h1 class="text-2xl font-semibold text-[#4F8C8C] mb-6 text-center ">
    旅行条件（{{ username }} / MBTI: {{ mbti }}）
  </h1>

  <form method="post" action="{{ url_for('plan.plan') }}" id="plan-form" class="space-y-6 max-w-4xl mx-auto">

    <fieldset class="bg-white border-2 border-[#EFD8C0] rounded-xl p-6 shadow-md space-x-2 max-w-4xl mx-auto">
      <legend class="text-[#4F8C8C] font-bold text-lg border-b-2 border-[#EFD8C0] pb-1 mb-3">
        基本情報
      </legend>

      <div class="mt-4">
        <label class="block mb-1 font-medium">旅行名：</label>
        <input name="trip_name" required maxlength="64" placeholder="例：京都旅行"
          class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
      </div>

      <div class="mt-4 flex flex-col gap-3">
        <label class="font-medium">開始日：</label>
        <input type="date" name="start_date" required class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />

        

      <div class="mt-4">
        <label class="font-medium">終了日：</label>
        <input type="date" name="end_date" required
          class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />

      <div class="mt-4">
        <label class="font-medium">人数：</label>
        <input type="number" name="headcount" min="1" value="1" required
          class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
      </div>

      <div class="mt-4">
        <label class="font-medium">予算（円）：</label>
        <input type="number" name="budget" min="1000" step="1000" required
          class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
      </div>

      <div class="mt-4">
        <label class="font-medium">補足（任意）：</label>
        <input name="notes" placeholder="車NG / 辛い物NG など"
          class="w-full rounded-lg border border-borderSoft bg-baseBg text-textMain text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
      </div>
    </fieldset>

    <fieldset class="bg-white border-2 border-[#EFD8C0] rounded-xl p-6 shadow-md space-x-2 max-w-4xl mx-auto">
      <legend class="text-[#4F8C8C] font-bold text-lg border-b-2 border-[#EFD8C0] pb-1 mb-3">
        行き先
      </legend>

      <div class="mt-3">
        <label class="block mb-1 font-medium">地域（必須）：</label>
        <select id="region-select" name="region" required
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                 focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5">
          <option value="">読込中...</option>
        </select>
      </div>

      <div class="mt-3">
        <label class="block mb-1 font-medium">都道府県（任意）：</label>
        <select id="prefecture-select" name="prefecture"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                 focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5">
          <option value="">自動提案に任せる</option>
        </select>
        <span class="text-sm text-gray-500">未選択のままでOK（LLMが提案）</span>
      </div>

      <div class="mt-3">
        <label class="block mb-1 font-medium">市区町村（任意）：</label>
        <select id="city-select" name="city"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                 focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5">
          <option value="">自動提案に任せる</option>
        </select>
        <span class="text-sm text-gray-500">未選択のままでOK（LLMが提案）</span>
      </div>
    </fieldset>

    <!-- 絶対に行きたい場所 -->
   <fieldset class="bg-white border-2 border-[#EFD8C0] rounded-xl p-6 shadow-md">
     <legend class="text-[#4F8C8C] font-bold">絶対に行きたい場所（任意）</legend>
     <div class="mt-3">
       <label class="block mb-1 font-medium">行きたいスポット：</label>
       <textarea name="must_visit" rows="2" placeholder="例：清水寺、金閣寺、伏見稲荷大社"
         class="w-full rounded-lg border border-borderSoft bg-baseBg text-sm p-2.5 
                focus:ring-accent focus:border-accent focus:outline-none"></textarea>
       <p class="text-xs text-gray-500 mt-1">
         カンマ区切りで複数入力できます。例：「清水寺、祇園、嵐山」など。
         未入力でも自動で提案します。
       </p>
     </div>
   </fieldset>

    <!--  出発地・交通手段（DBなしの表面入力） -->
    <fieldset class="bg-white border-2 border-[#EFD8C0] rounded-xl p-6 shadow-md">
      <legend class="text-[#4F8C8C] font-bold">出発と交通</legend>

      <div class="mt-3">
        <label class="block mb-1 font-medium">出発地（任意）：</label>
        <input name="departure" placeholder="例：東京駅 / 新大阪駅 / 横浜市内"
          class="w-full rounded-lg border border-borderSoft bg-baseBg text-sm p-2.5 
                 focus:ring-accent focus:border-accent focus:outline-none" />
        <p class="text-xs text-gray-500 mt-1">未入力でもOK（地域から推定）。入力すると移動時間・交通が現実的になります。</p>
      </div>

      <div class="mt-3">
        <label class="block mb-1 font-medium">希望する交通手段（任意）：</label>
        <select name="transport_pref"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                 focus:ring-[#4F8C8C] focus:border-[#4F8C8C] block w-full p-2.5">
          <option value="auto" selected>おまかせ（条件に合わせて最適化）</option>
          <option value="public">公共交通中心（電車・バス）</option>
          <option value="train">鉄道中心（在来線）</option>
          <option value="shinkansen">新幹線優先</option>
          <option value="car">レンタカー中心</option>
          <option value="plane">飛行機優先</option>
          <option value="mixed">状況に応じて混在</option>
        </select>
      </div>
    </fieldset>


    <button type="submit"
      class="bg-[#4F8C8C] text-white font-semibold py-2 px-4 rounded-lg shadow hover:bg-[#3E7676] transition">
      決定
    </button>
  </form>
</main>


  <!-- ✅ 固定ナビゲーションバー -->
<div class="dock fixed bottom-0 left-0 w-full bg-white border-t border-gray-300 shadow-inner flex justify-around py-2">
  <!-- 旅のタイムライン（Time Line） -->
  <a href="{{ url_for('my_travel.travel_details') }}" 
     class="flex flex-col items-center {% if request.endpoint == 'my_travel.travel_details' %}text-teal-600 font-semibold{% else %}text-gray-700{% endif %} hover:text-teal-600 focus:outline-none">
    <svg class="w-5 h-5 {% if request.endpoint == 'my_travel.travel_details' %}text-teal-600{% endif %}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
      <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="text-xs mt-1">Time Line</span>
  </a>

  <!-- ホームボタン（Home） -->
  <a href="{{ url_for('home.home') }}" 
     class="flex flex-col items-center {% if request.endpoint == 'home.home' %}text-teal-600 font-semibold{% else %}text-gray-700{% endif %} hover:text-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-400 rounded-lg">
    <svg class="w-5 h-5 {% if request.endpoint == 'home.home' %}text-teal-600{% endif %}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
      <g fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 12 12 3 21 12" />
        <path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10" />
      </g>
    </svg>
    <span class="text-xs mt-1">Home</span>
  </a>

  <!-- マイトラベル（My Travel） -->
  <a href="{{ url_for('plan.plan') }}" 
     class="flex flex-col items-center {% if request.endpoint == 'plan.plan' %}text-teal-600 font-semibold{% else %}text-gray-700{% endif %} hover:text-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-400 rounded-lg">
    <svg
  class="w-5 h-5 {% if request.endpoint == 'plan.plan' %}text-teal-600{% endif %}"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round">
  <line x1="12" y1="5" x2="12" y2="19" />
  <line x1="5" y1="12" x2="19" y2="12" />
</svg>
    <span class="text-xs mt-1">Travel Plan</span>
  </a>
</div>
  
  <script src="{{ url_for('static', filename='js/geo.js') }}"></script>
</body>
</html>
